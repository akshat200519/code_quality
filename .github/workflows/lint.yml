name: Code Quality & Linting

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install flake8 pylint bandit

      - name: Run Flake8
        run: flake8 .  # Analyze the entire directory

      - name: Run Pylint
        run: pylint sample.py # Keeping it as sample.py as per your previous runs

      - name: Run Bandit
        run: bandit -r .  # Analyze the entire directory recursively

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Recommended for accurate branch analysis

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          args: >
            -Dsonar.organization="Akshat Singh" # Using the organization name from the image
            -Dsonar.projectKey=akshat200519_code_quality # REPLACE WITH YOUR ACTUAL PROJECT KEY
            -Dsonar.python.version=3.10 # Match your Python version
            -Dsonar.sources=.
            -Dsonar.host.url=https://sonarcloud.io
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}