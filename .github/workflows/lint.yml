name: Code Quality & Linting

on: [push, pull_request]  # Runs on every push and PR

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # Choose your desired version

      - name: Install dependencies
        run: |
          pip install flake8 pylint bandit  # Install linting tools

      - name: Run Flake8 (Style Checks)
        run: flake8 sample.py  # Run flake8

      - name: Run Pylint (Code Quality)
        run: pylint sample.py  # Run pylint for code quality checks

      - name: Run Bandit (Security Check)
        run: bandit -r sample.py  # Run Bandit for security analysis

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          organization: <your-sonarcloud-org-name>  # Your SonarCloud organization
          projectKey: <your-sonarcloud-project-key>  # Your SonarCloud project key
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}  # Access token for SonarCloud
